[project]
name = "momlab"
version = "0.1.0"
description = "Event-driven backtest engine and vol-scaled industry momentum study (hypothetical backtests, not investment advice)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kouki" }
]
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bt>=1.4.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pandas-datareader>=0.11.1",
    "pandas-stubs>=3.1.0.261029",
    "purgedcv>=0.1.11",
    "pyinstrument>=5.1.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "quantstats>=0.0.86",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs/plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD"]

[tool.ruff.lint.isort]
known-first-party = ["momlab"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "momlab.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "bt.*", "quantstats.*", "statsmodels.*", "scipy.*", "sklearn.*", "pyarrow.*", "purgedcv.*", "pandas_datareader.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]
markers = [
    "data: needs the real downloaded data (run `uv run python tasks.py data` first)",
    "slow: long-running test",
]

[tool.coverage.run]
source = ["momlab"]
branch = false

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.coverage.html]
directory = "reports/coverage"
